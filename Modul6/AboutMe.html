  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Lato', sans-serif;
      background: #f5f5f3;
      color: #1a1a1a;
      min-height: 100vh;
    }

    .corner {
      position: fixed;
      width: 30px;
      height: 30px;
      z-index: 9999;
    }
    .corner-tl { top: 0; left: 0;    border-top: 5px solid #222; border-left: 5px solid #222; }
    .corner-tr { top: 0; right: 0;   border-top: 5px solid #222; border-right: 5px solid #222; }
    .corner-bl { bottom: 0; left: 0; border-bottom: 5px solid #222; border-left: 5px solid #222; }
    .corner-br { bottom: 0; right: 0;border-bottom: 5px solid #222; border-right: 5px solid #222; }

    .navbar {
      border-bottom: 1px solid #d8d8d8;
      padding: 6px 20px;
      background: #efefef !important;
      flex-wrap: nowrap !important;
    }
    .navbar-brand {
      font-family:  'Georgia', serif;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: #222 !important;
      white-space: nowrap;
      flex-shrink: 0;
      margin-left: 24px;
    }
    .navbar-collapse {
      display: flex !important;
      flex-basis: auto !important;
      flex-grow: 1 !important;
    }
    .navbar-nav {
      flex-direction: row !important;
      margin-left: auto;
      align-items: center;

    .navbar-toggler { display: none !important; }
    .nav-link {
      font-size: 0.55rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #666 !important;
      padding: 2px 8px !important;
      font-family: 'Lato', sans-serif;
      white-space: nowrap;
    }
    .nav-link:hover { color: #000 !important; }
    .nav-link.active-nav {
      border: 1px solid #999;
      border-radius: 6px;
      color: #222 !important;
      padding: 2px 10px !important;
    }

    .page-content {
      padding: 60px 24px 80px;
      max-width: 960px;
      margin: 0 auto;
    }

    .section-label {
      font-size: 0.65rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #999;
      margin-bottom: 10px;
    }
    .section-title {
      font-family: 'Playfair Display', serif;
      font-size: 2.8rem;
      font-weight: 700;
      color: #111;
      line-height: 1.1;
      margin-bottom: 48px;
    }
    .section-title em {
      font-style: italic;
      font-weight: 400;
    }

    .profile-card {
      background: #fff;
      border-radius: 2px;
      overflow: hidden;
      display: grid;
      grid-template-columns: 300px 1fr;
      min-height: 420px;
      box-shadow: 0 2px 24px rgba(0,0,0,0.07);
    }

    .profile-photo-panel {
      position: relative;
      background: #f5f5f3;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 40px 24px;
      gap: 16px;
    }
    .profile-photo-circle {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      overflow: hidden;
      border: 4px solid #e0e0e0;
      flex-shrink: 0;
    }
    .profile-photo-circle img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.5s;
    }
    .profile-photo-circle:hover img {
      transform: scale(1.06);
    }
    .photo-overlay {
      text-align: center;
    }
    .photo-name {
      font-family: 'Playfair Display', serif;
      font-size: 1rem;
      font-weight: 700;
      color: #111;
      letter-spacing: 0.3px;
    }
    .photo-role {
      font-size: 0.6rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #999;
      margin-top: 4px;
    }

    .profile-info-panel {
      padding: 48px 44px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .info-tag {
      font-size: 0.6rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #aaa;
      margin-bottom: 20px;
      padding-bottom: 20px;
      border-bottom: 1px solid #eee;
    }

    .info-row {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      padding: 16px 0;
      border-bottom: 1px solid #f0f0f0;
    }
    .info-row:last-of-type { border-bottom: none; }

    .info-icon {
      width: 36px;
      height: 36px;
      background: #f5f5f3;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 0.75rem;
      color: #555;
      margin-top: 2px;
    }
    .info-label {
      font-size: 0.6rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #aaa;
      margin-bottom: 3px;
    }
    .info-value {
      font-size: 0.9rem;
      color: #1a1a1a;
      font-weight: 400;
      line-height: 1.5;
    }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1px;
      background: #e8e8e8;
      margin-top: 24px;
      border-radius: 2px;
      overflow: hidden;
    }
    .stat-item {
      background: #fff;
      padding: 24px;
      text-align: center;
    }
    .stat-number {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      font-weight: 700;
      color: #111;
      line-height: 1;
      margin-bottom: 6px;
    }
    .stat-label {
      font-size: 0.6rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #aaa;
    }

    .btn-back {
      margin-top: 36px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #1a1a1a;
      color: #fff;
      border: none;
      padding: 11px 24px;
      font-size: 0.65rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-family: 'Lato', sans-serif;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      border-radius: 2px;
      transition: background 0.2s, transform 0.2s;
    }
    .btn-back:hover {
      background: #333;
      color: #fff;
      transform: translateX(-3px);
    }

    @media (max-width: 680px) {
      .profile-card { grid-template-columns: 1fr; }
      .profile-photo-panel { height: 280px; }
      .profile-info-panel { padding: 28px 24px; }
      .section-title { font-size: 2rem; }
      .stats-row { grid-template-columns: repeat(3, 1fr); }
    }
  </style>
</head>
